# Checks every push and pull request: Go servers, desktop/web client, site, and
# the end-to-end scenarios (real services, real Electron app, real LiveKit).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned by commit (a moved tag cannot change what runs); Dependabot updates them.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVEKIT_VERSION: 1.13.7
  LIVEKIT_SHA256: 6634aeeb2fb1366b6723708ae4320b9d5408106a4c63457c5e845ae3979c90e2

jobs:
  go:
    name: Go (vet, tests, vulnerabilities)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: go vet ./...
      - run: make test 2>&1 | tee /tmp/go-test.log
      - name: Targeted Go race checks
        run: go test -race -timeout 300s ./internal/community ./internal/identity ./internal/realtime
      - name: Import boundary policy and negative fixtures
        run: go test ./tools/import-boundaries && go run ./tools/import-boundaries
      - name: Failed tests (annotations, readable without signing in)
        if: failure()
        run: grep -E -- '--- FAIL|_test\.go:[0-9]+|^FAIL|panic:|timed out' /tmp/go-test.log | head -40 | sed 's/^/::error::/'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  client:
    name: Client (types, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install
        working-directory: client
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: make client-test
      - name: Build
        working-directory: client
        run: npx vite build && node scripts/build-electron.mjs
      - name: Encryption interoperability (vodozemac ↔ goolm)
        run: make client-interop

  containers:
    name: Docker OCI stack (build, health, dev checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build all current product and dev images
        run: docker compose --profile dev -f deploy/compose/compose.yaml build
      - name: Start stack and wait for in-container health checks
        run: docker compose -f deploy/compose/compose.yaml up --detach --wait
      - name: Assert health state and site response
        run: |
          docker compose -f deploy/compose/compose.yaml ps --format json | jq -s -e 'length == 4 and all(.[]; .Health == "healthy")'
          curl --fail --silent http://127.0.0.1:18000/ | grep -q '<html'
          curl --fail --silent http://127.0.0.1:18080/v1/health
          curl --fail --silent http://127.0.0.1:18090/v1/health
          curl --fail --silent http://127.0.0.1:18095/health
      - name: Go tests inside the dev image
        run: docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make test
      - name: Build, vet and enforce import boundaries inside the dev image
        run: |
          docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make build
          docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make vet
          docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev go run ./tools/import-boundaries
      - name: Go race checks inside the dev image
        run: docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev go test -race -timeout 300s ./internal/community ./internal/identity ./internal/realtime
      - name: Client checks inside the dev image
        run: docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make client-test
      - name: Desktop build inside the dev image
        run: docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make client-build
      - name: Encryption interoperability inside the dev image
        run: docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make client-interop
      - name: Site build inside the dev image
        run: docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make site-build
      - name: Record image ids and architecture
        run: docker image inspect localhost/quarel-identity:local localhost/quarel-server:local localhost/quarel-docs-mcp:local localhost/quarel-site:local localhost/quarel-dev:local --format '{{.RepoTags}} {{.Id}} {{.Os}}/{{.Architecture}}'
      - name: Stop stack and remove test data
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down --volumes --remove-orphans

  e2e-voice-docker:
    name: End-to-end voice (Docker, Linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make e2e-voice-docker

  site:
    name: Site quarel.app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: make site-build

  e2e-servers:
    name: End-to-end (servers, Docker dev image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --profile dev -f deploy/compose/compose.yaml build dev
      - run: docker compose --profile dev -f deploy/compose/compose.yaml run --rm --no-deps dev make e2e-servers

  e2e-client:
    name: End-to-end (desktop app, web client, voice)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: LiveKit (official build, checksum verified)
        run: |
          curl -fsSL -o /tmp/lk.tgz "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          echo "${LIVEKIT_SHA256}  /tmp/lk.tgz" | sha256sum -c -
          mkdir -p ~/.local/bin && tar -xzf /tmp/lk.tgz -C ~/.local/bin livekit-server
      - run: make build
      - name: Install client
        run: make client-install
      - name: Chromium for the web and voice tests
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Electron sandbox helper
        working-directory: client
        # Must be setuid root (Ubuntu restricts unprivileged user namespaces).
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: make e2e-client 2>&1 | tee /tmp/e2e-client.log
      - name: Failed tests (annotations, readable without signing in)
        if: failure()
        run: grep -E '✘|Error|waiting for|spec\.ts:[0-9]+' /tmp/e2e-client.log | head -40 | sed 's/^/::error::/'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: client/test-results/
          retention-days: 7
